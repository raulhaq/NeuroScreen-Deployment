<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Masuk — NeuroScreen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* =========================================================
       NeuroScreen — Authentication additions
       ========================================================= */

    .auth-error {
      display: none;
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff0f0;
      border: 1px solid #e7b7b7;
      color: #a33a3a;
      font-size: 12px;
      line-height: 1.5;
    }

    .auth-error.show {
      display: block;
    }

    .auth-success {
      display: none;
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #f1f8e9;
      border: 1px solid #c8dfad;
      color: #466b2a;
      font-size: 12px;
      line-height: 1.5;
    }

    .auth-success.show {
      display: block;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: #777;
      font-size: 11px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #dedbd0;
    }

    .google-btn {
      width: 100%;
      min-height: 42px;
      border: 1px solid #d8d5ca;
      border-radius: 8px;
      background: #ffffff;
      color: #222;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .google-btn:hover {
      background: #fafafa;
      border-color: #c8c4b8;
    }

    .google-btn:active {
      transform: translateY(1px);
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    .auth-switch {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }

    .auth-switch button {
      border: 0;
      padding: 0;
      background: none;
      color: #111;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-switch button:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      opacity: 0.65;
      pointer-events: none;
    }
  </style>
</head>

<body class="login-page">

  <div class="wrap">

    <nav>

      <div class="logo">

        <svg
          width="26"
          height="26"
          viewBox="0 0 26 26"
          fill="none">

          <rect
            width="26"
            height="26"
            rx="7"
            fill="#111111"/>

          <path
            d="M5 13 Q7.5 8, 10 13 T15 13 T21 13"
            stroke="#D4FF5C"
            stroke-width="1.8"
            fill="none"
            stroke-linecap="round"/>

        </svg>

        <span class="logo-text">NeuroScreen</span>

      </div>

    </nav>

  </div>


  <div class="center-stage">

    <div class="login-card">

      <div class="eyebrow">
        <span class="dot"></span>
        Akses profesional
      </div>


      <h1 id="authTitle">
        Masuk ke akun Anda
      </h1>


      <p
        class="subtitle"
        id="authSubtitle">

        Gunakan akun Anda untuk mengakses NeuroScreen.

      </p>


      <!-- =====================================================
           ERROR / SUCCESS MESSAGE
           ===================================================== -->

      <div
        id="authError"
        class="auth-error">
      </div>

      <div
        id="authSuccess"
        class="auth-success">
      </div>


      <!-- =====================================================
           AUTH FORM
           ===================================================== -->

      <form id="loginForm">


        <!-- NAMA
             Hanya muncul saat REGISTER -->

        <div
          class="field hidden"
          id="nameField">

          <label for="name">
            Nama lengkap
          </label>

          <input
            type="text"
            id="name"
            placeholder="Nama lengkap"
            autocomplete="name">

        </div>


        <!-- EMAIL -->

        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required>

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="password">
            Kata sandi
          </label>

          <input
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required>

        </div>
        <div
          id="passwordHint"
          class="field-hint hidden">

          Minimal 8 karakter.

        </div>

        <!-- KONFIRMASI PASSWORD
             Hanya muncul saat REGISTER -->

        <div
          class="field hidden"
          id="confirmPasswordField">

          <label for="confirmPassword">
            Konfirmasi kata sandi
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password">

        </div>


        <!-- FORGOT PASSWORD -->

        <div
          class="field-hint"
          id="forgotPassword">

          <button
            type="button"
            id="forgotPasswordBtn"
            style="
              border:0;
              background:none;
              padding:0;
              font:inherit;
              color:inherit;
              cursor:pointer;
            ">

            Lupa kata sandi?

          </button>

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="btn-submit"
          id="submitBtn">

          Masuk

        </button>

      </form>


      <!-- =====================================================
           GOOGLE
           ===================================================== -->

      <div
        class="auth-divider"
        id="googleDivider">

        atau

      </div>


      <button
        type="button"
        class="google-btn"
        id="googleBtn">

        <svg
          class="google-icon"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">

          <path
            fill="#4285F4"
            d="M21.35 12.23c0-.79-.07-1.55-.23-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"/>

          <path
            fill="#34A853"
            d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.75 9.75 0 0 0 12 21.5z"/>

          <path
            fill="#FBBC05"
            d="M6.54 13.59A5.86 5.86 0 0 1 6.23 12c0-.55.11-1.09.31-1.59V7.89H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.41l3.24-2.82z"/>

          <path
            fill="#EA4335"
            d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.46 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.7 5.39l3.24 2.52C7.31 8.1 9.46 6.38 12 6.38z"/>

        </svg>

        <span id="googleBtnText">
          Lanjutkan dengan Google
        </span>

      </button>


      <!-- =====================================================
           LOGIN / REGISTER SWITCH
           ===================================================== -->

      <div class="auth-switch">

        <span id="switchText">
          Belum punya akun?
        </span>

        <button
          type="button"
          id="switchModeBtn">

          Daftar

        </button>

      </div>


      <p class="disclaimer-mini">

        Akses ke sistem ini tunduk pada kebijakan
        privasi data pasien yang berlaku.

      </p>

    </div>

  </div>


  <footer>

    <span class="footer-mark">
      NeuroScreen — Prototipe CDSS, RKI USK 2026
    </span>

  </footer>


  <!-- Firebase / Authentication -->
  <script
    type="module"
    src="js/login.js">
  </script>

</body>
</html>
